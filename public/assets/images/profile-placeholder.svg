<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 440" width="350" height="440">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f0" />
      <stop offset="100%" stop-color="#eaeae2" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e5df" />
      <stop offset="100%" stop-color="#cfd5cb" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="350" height="440" fill="url(#bgGrad)" />

  <!-- Subtle grid lines -->
  <line x1="0" y1="110" x2="350" y2="110" stroke="rgba(0,0,0,0.03)" stroke-width="1" />
  <line x1="0" y1="220" x2="350" y2="220" stroke="rgba(0,0,0,0.03)" stroke-width="1" />
  <line x1="0" y1="330" x2="350" y2="330" stroke="rgba(0,0,0,0.03)" stroke-width="1" />
  <line x1="175" y1="0" x2="175" y2="440" stroke="rgba(0,0,0,0.03)" stroke-width="1" />

  <!-- Elegant minimalist portrait silhouette -->
  <g transform="translate(0, 10)">
    <!-- Shoulders / Torso -->
    <path d="M 75 380 C 75 295, 115 250, 175 250 C 235 250, 275 295, 275 380 Z" fill="url(#avatarGrad)" />
    
    <!-- Head / Silhouette -->
    <circle cx="175" cy="180" r="54" fill="url(#avatarGrad)" />
    
    <!-- Subtle architectural / analytical contour accent -->
    <path d="M 110 375 C 130 305, 150 265, 175 265 C 200 265, 220 305, 240 375" fill="none" stroke="#3d5d36" stroke-width="2" stroke-linecap="round" opacity="0.4" />
    <circle cx="175" cy="180" r="58" fill="none" stroke="#3d5d36" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.3" />
  </g>

  <!-- Subtle label tag -->
  <rect x="95" y="380" width="160" height="28" rx="14" fill="#ffffff" stroke="rgba(0,0,0,0.08)" />
  <text x="175" y="398" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#585d53" letter-spacing="0.5" text-anchor="middle">Akshat Tripathi</text>
</svg>
